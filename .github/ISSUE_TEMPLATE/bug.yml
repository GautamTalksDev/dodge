name: Bug report
description: The website, a workflow or the engine does not work as documented.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL and browser, or the workflow run link.
