# Recorder: every 4 hours, keep the orbit history CelesTrak does not.
#
# Two jobs, so code that touches third-party data never holds a write token:
#   fetch    contents: read   downloads from CelesTrak, merges into today's file
#   publish  contents: write  uploads to today's release, appends the run log
# Each UTC day's release (day-YYYY-MM-DD) is sealed the next morning by
# screen.yml: SHA-256 manifest chained to the previous day, plus a Sigstore
# attestation. See docs/SECURITY_PRACTICES.md.
name: record
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: data-publish
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch today's file so far
        run: |
          D=$(date -u +%F)
          echo "D=$D" >> "$GITHUB_ENV"
          mkdir -p work
          gh release download "day-$D" -D work 2>/dev/null || echo "first run of $D"
      - name: Record
        run: |
          set -o pipefail
          python3 recorder/record.py work | tee work/run.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recording
          path: work/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recording
          path: work
      - name: Upload to today's release
        run: |
          D=$(date -u +%F)
          gh release view "day-$D" >/dev/null 2>&1 || \
            gh release create "day-$D" --title "Orbit data $D" --latest=false \
              --notes "Orbit recordings first seen on $D (UTC) from CelesTrak, and that day's screen. Sealed the next morning with a SHA-256 manifest chained to the previous day and a Sigstore attestation. Verify: see docs/VERIFYING.md."
          shopt -s nullglob
          files=(work/gp-*.ndjson.gz work/satcat-*.csv.gz work/supgp-sources-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::Nothing new to upload this run (CelesTrak unreachable or unchanged)."
          else
            gh release upload "day-$D" "${files[@]}" --clobber
          fi
      - name: Append the run log
        run: |
          cat work/run.json >> data/runs.ndjson
          git config user.name "dodge-recorder"
          git config user.email "dodge-recorder@users.noreply.github.com"
          git add data/runs.ndjson
          git commit -q -m "record: $(date -u +%FT%H:%MZ)"
          git pull -q --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
