# Once a day: screen the next 24 hours of Starlink against everything else.
# The site reads the result from the `data` branch, which holds only the
# latest files and is replaced every day, so git history stays small. Each
# day's summary and full event list also go into that day's release.
name: screen
on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the orbit model
        run: python3 -m venv .venv && .venv/bin/pip install --quiet -r requirements.txt
      - name: Fetch the last two days of recordings
        run: |
          mkdir -p work
          for d in $(date -u -d yesterday +%F) $(date -u +%F); do
            gh release download "day-$d" -D work -p "gp-*" -p "satcat-*" -p "supgp-sources-*" 2>/dev/null || echo "no data for $d"
          done
          ls -la work
      - name: Tests
        run: .venv/bin/python -m unittest discover -s tests -p "test_*.py"
      - name: Screen and attribute
        run: .venv/bin/python engine/daily.py work out
      - name: Archive the day in its release
        run: |
          D=$(date -u +%F)
          cp out/days/$D.json out/summary-$D.json
          gh release upload "day-$D" out/events-$D.json.gz out/summary-$D.json --clobber
      - name: Publish the data branch
        run: |
          mkdir pub && cp out/latest.json out/replay.json out/starlink.json pub/
          cd pub
          git init -q -b data
          git config user.name "dodge-screen"
          git config user.email "dodge-screen@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%FT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
